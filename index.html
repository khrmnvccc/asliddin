// Styled option sheet instead of the phone's plain system list for every <select>.
function pkLabel(s){if(s.getAttribute('aria-label'))return s.getAttribute('aria-label');const l=s.id&&document.querySelector(`label[for="${s.id}"]`);if(l)return l.textContent.trim();const p=s.previousElementSibling;return p&&p.tagName=='LABEL'?p.textContent.trim():'Tanlang'}
function pkSync(s){const b=s._pk;if(!b)return;const o=s.options[s.selectedIndex];b.querySelector('span').textContent=o?o.text:''}
function pkEnhance(root){(root.querySelectorAll?root:document).querySelectorAll('select:not([data-pk])').forEach(s=>{s.dataset.pk=1;const b=document.createElement('button');b.type='button';b.className='pk';b.style.cssText=s.style.cssText;b.innerHTML='<span></span>';b.onclick=()=>pkOpen(s);s._pk=b;s.classList.add('pk-src');s.after(b);s.addEventListener('change',()=>pkSync(s));new MutationObserver(()=>pkSync(s)).observe(s,{childList:true,subtree:true,attributes:true});pkSync(s)})}
function pkOpen(s){let d=$('#pkDlg');if(!d){d=document.createElement('dialog');d.id='pkDlg';d.className='pk-dlg';d.onclick=e=>{if(e.target==d)d.close()};document.body.append(d)}

d.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{s.selectedIndex=+b.dataset.i;pkSync(s);s.dispatchEvent(new Event('change',{bubbles:true}));d.close()});d.showModal();if(window.lucide)lucide.createIcons();d.querySelector('.on')?.scrollIntoView({block:'center'})}
// Ilova uslubidagi kalendar: telefonning oq (va ruscha) sana oynasi o‘rniga.

const dpIso=(y,m,d)=>`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
const dpToday=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tashkent'}).format(new Date());
function dpSync(i){const b=i._dp;if(!b)return;const v=i.value;b.querySelector('span').textContent=v?v.split('-').reverse().join('.'):(i.getAttribute('placeholder')||'Sana tanlanmagan');b.classList.toggle('empty',!v)}
function dpEnhance(){document.querySelectorAll('input[type=date]:not([data-dp])').forEach(i=>{i.dataset.dp=1;const b=document.createElement('button');b.type='button';b.className='pk dp';b.style.cssText=i.style.cssText;b.innerHTML='<span></span>';b.onclick=()=>dpOpen(i);i._dp=b;i.classList.add('pk-src');i.after(b);i.addEventListener('change',()=>dpSync(i));dpSync(i)})}
function dpOpen(i,ym){let d=$('#dpDlg');if(!d){d=document.createElement('dialog');d.id='dpDlg';d.className='pk-dlg';d.onclick=e=>{if(e.target==d)d.close()};document.body.append(d)}
const sel=i.value,base=ym||(sel||dpToday()).slice(0,7),[y,m]=base.split('-').map(Number),first=(new Date(Date.UTC(y,m-1,1)).getUTCDay()+6)%7,days=new Date(Date.UTC(y,m,0)).getUTCDate(),t=dpToday();
let cells='';for(let k=0;k<first;k++)cells+='<span></span>';for(let k=1;k<=days;k++){const v=dpIso(y,m-1,k);cells+=`<button type="button" data-v="${v}" class="${v==sel?'on':''} ${v==t?'today':''}">${k}</button>`}
const prev=dpIso(m==1?y-1:y,m==1?11:m-2,1).slice(0,7),next=dpIso(m==12?y+1:y,m==12?0:m,1).slice(0,7);
d.innerHTML=`<div class="pk-head">${esc(pkLabel(i))}</div><div class="dp-nav"><button type="button" data-ym="${prev}">${ic('chevron-left')}</button><b>${DP_M[m-1]} ${y}</b><button type="button" data-ym="${next}">${ic('chevron-right')}</button></div><div class="dp-grid dp-wd">${['Du','Se','Ch','Pa','Ju','Sh','Ya'].map(x=>`<span>${x}</span>`).join('')}</div><div class="dp-grid">${cells}</div><div class="row" style="margin-top:12px">${i.required?'':`<button type="button" class="btn g" data-v="">Tozalash</button>`}<button type="button" class="btn g" data-v="${t}">Bugun</button></div>`;
